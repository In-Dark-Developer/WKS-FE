# 백엔드 REST API 계약의 **참조본**이다 (source of truth 는 백엔드 저장소).
# - 프론트엔드는 이 문서를 보고 구현하고, 실제 응답이 다르면 백엔드 저장소에 이슈로 올린 뒤 이 파일을 맞춘다.
# - 아래 경로는 docs/PRD.md 의 FR 에서 도출한 초안이며, 백엔드 계약이 공개되면 통째로 교체한다 (Phase 03).
# - 검증 예: npx @redocly/cli lint docs/api/openapi.yaml
openapi: 3.1.0
info:
  title: 운꿰사 API (frontend reference copy)
  version: 0.0.1-draft
  description: 사주 결과·공유·궁합·매칭을 제공하는 백엔드 API. 이 사본은 프론트엔드가 소비하는 계약의 참조본이다.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: saju
    description: 사주 입력과 결과
  - name: share
    description: 공유 링크와 궁합
  - name: matching
    description: 소개팅 후보와 운명의 실
paths:
  /readings:
    post:
      operationId: createReading
      summary: 사주 입력으로 결과를 만든다 (FR-2, FR-3)
      tags: [saju]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadingRequest" }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reading" }
        "400":
          description: 입력 오류
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /shares/{shareId}:
    get:
      operationId: getShare
      summary: 공유 링크로 링크 주인의 요약을 조회한다 (FR-4, FR-14)
      tags: [share]
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareSummary" }
        "404":
          description: 없는 링크
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /shares/{shareId}/compatibility:
    post:
      operationId: createCompatibility
      summary: 방문자의 사주로 궁합 점수를 만든다 (FR-6, FR-7)
      tags: [share]
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadingRequest" }
      responses:
        "201":
          description: 산출됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Compatibility" }
  /me/friends:
    get:
      operationId: listFriendScores
      summary: 내 친구 점수 목록 (FR-8)
      tags: [share]
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Compatibility" }
  /me/threads:
    post:
      operationId: sendThread
      summary: 운명의 실을 보낸다 (FR-13)
      tags: [matching]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId]
              properties:
                targetId: { type: string }
      responses:
        "201":
          description: 보냄
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
components:
  schemas:
    ReadingRequest:
      type: object
      required: [birthDate, gender, nickname]
      properties:
        birthDate: { type: string, format: date }
        birthTime: { type: [string, "null"], description: "HH:mm. 모르면 null" }
        birthRegion: { type: [string, "null"], description: "모르면 null" }
        gender: { type: string, enum: [female, male, other] }
        nickname: { type: string, maxLength: 20 }
    Reading:
      type: object
      required: [id, shareId, zodiac, sections]
      properties:
        id: { type: string }
        shareId: { type: string, description: 공유 링크 식별자 }
        zodiac: { type: string, description: 십이간지 (점지 카드 캐릭터) }
        sections:
          type: object
          required: [love, wealth, study, festivalItem, fortune]
          properties:
            love: { $ref: "#/components/schemas/ReadingSection" }
            wealth: { $ref: "#/components/schemas/ReadingSection" }
            study: { $ref: "#/components/schemas/ReadingSection" }
            festivalItem: { $ref: "#/components/schemas/ReadingSection" }
            fortune: { $ref: "#/components/schemas/ReadingSection" }
    ReadingSection:
      type: object
      required: [score, text]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        text: { type: string, description: 보살 말투 문구 }
    ShareSummary:
      type: object
      required: [shareId, nickname, zodiac]
      properties:
        shareId: { type: string }
        nickname: { type: string }
        zodiac: { type: string }
    Compatibility:
      type: object
      required: [score, grade, nickname]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        grade: { type: string, enum: [gwiin, chaltteok, beot, seuchim], description: "25점 구간 — 귀인·찰떡·벗·스침" }
        nickname: { type: string }
    Thread:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [sent, matched], description: matched 일 때만 contact 가 온다 }
        contact: { type: [string, "null"] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: 기계가 읽는 에러 코드 }
        message: { type: string, description: 사람이 읽는 설명 }
