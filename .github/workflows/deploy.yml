# 프론트 운영 배포 — main 병합마다 dist 를 S3 에 올리고 CloudFront 캐시를 비운다.
# ADR-20260914-aws-cloudfront-hosting · 설정 절차 docs/deploy/aws-frontend.md
# AWS 비밀키는 두지 않는다 — GitHub OIDC 로 배포 역할을 잠깐 빌린다. 저장소 변수가 채워지기 전에는 건너뛴다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # 해시가 붙은 자산은 오래 캐시하고 지우지 않는다 — 배포 도중 이전 index.html 을 받은 사용자가 옛 청크를 찾을 수 있게.
      - name: upload assets
        run: >-
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets"
          --cache-control "public,max-age=31536000,immutable"
      # index.html 등 해시 없는 파일은 매번 재검증한다.
      - name: upload entry files
        run: >-
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}"
          --exclude "assets/*" --delete
          --cache-control "no-cache"
      - name: invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
