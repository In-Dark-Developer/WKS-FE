name: notion-probe
on: { workflow_dispatch: }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          for v in 2022-06-28 2025-09-03; do
            echo "=== Notion-Version: $v"
            curl -sS -X POST https://api.notion.com/v1/search \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Notion-Version: $v" -H "Content-Type: application/json" \
              -d '{"page_size":50}' \
            | jq -r '.object as $o | if $o=="error" then "ERROR \(.status) \(.code) \(.message)" else (.results[] | "\(.object)\t\(.id)\t\((.title // .name // [])[0].plain_text // (.properties|keys|join(",")) // "")") end' \
            | head -60
          done
