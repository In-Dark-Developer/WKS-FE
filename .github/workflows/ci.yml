name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  pr-body:
    # PR 을 열 때 본문이 템플릿 플레이스홀더 그대로면(웹에서 열었을 때) HANDOFF·LOG 초안으로 채우고
    # 제목도 규격으로 맞춘다. 사람이 쓴 제목·본문은 건드리지 않는다.
    # 로컬에서는 scripts/ai-end.sh --ready --pr|--web 이 같은 초안을 넣는다.
    # fork PR 은 github.token 에 write 권한이 없어 실패한다 — 이 저장소는 private 팀 저장소라 해당 없음.
    if: ${{ github.event.action == 'opened' && startsWith(github.head_ref, 'ws/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: fetch main
        run: git fetch origin main:refs/remotes/origin/main
      - name: fill title and body from the stream draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        # 플레이스홀더 마커 '<두세 문장' 은 .github/PULL_REQUEST_TEMPLATE.md 의 '무엇을 · 왜' 자리 문구다 — 템플릿을 바꾸면 같이 바꾼다.
        run: |
          args=()
          if [ -z "$PR_BODY" ] || printf '%s' "$PR_BODY" | grep -q '<두세 문장'; then
            bash scripts/ai-end.sh --pr-body > /tmp/pr-body.md
            args+=(--body-file /tmp/pr-body.md)
            echo "본문: 초안으로 채움"
          fi
          if ! printf '%s' "$PR_TITLE" | grep -qE '^[a-z-]+\([a-z0-9._/-]+\): .+ \[([0-9]{2}|-)/(T[0-9]+|-)\]$'; then
            args+=(--title "$(bash scripts/ai-end.sh --pr-title)")
            echo "제목: 규격으로 교체"
          fi
          if [ "${#args[@]}" -eq 0 ]; then echo "사람이 쓴 제목·본문 — 그대로 둔다"; exit 0; fi
          gh pr edit "$PR_NUMBER" "${args[@]}"

  ai-check:
    # 스트림 규칙 검사 — hotfix/* 브랜치는 Commands 만 검사한다.
    # pr-body 가 제목·본문을 고칠 수 있으니 그 뒤에 돌고(skip 돼도 돈다), 페이로드가 아니라 현재 값을 읽는다.
    needs: [pr-body]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: fetch main
        run: git fetch origin main:refs/remotes/origin/main
      - name: ai-end.sh --ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title -q .title) \
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body) \
            bash scripts/ai-end.sh --ci

  commands:
    # 제목·본문만 고친 edited 이벤트에서는 돌리지 않는다.
    if: ${{ github.event.action != 'edited' }}
    # AGENTS.md 의 Commands 4개를 그대로 돌린다. 경고는 스크립트 자체가 실패로 만든다
    # (eslint --max-warnings=0 · prettier --check · tsc --noEmit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
