name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# 같은 PR 에 새 push 가 오면 돌던 run 을 버린다 — WIP push 를 밀 때마다 완주하는 run 이 쌓이던 것을 막는다.
# main 은 취소하지 않는다(병합마다 한 번은 끝까지 돈다).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-body:
    # PR 을 열 때 본문이 템플릿 플레이스홀더 그대로면(웹에서 열었을 때) HANDOFF·LOG 초안으로 채우고
    # 제목도 규격으로 맞춘다. 사람이 쓴 제목·본문은 건드리지 않는다.
    # 로컬에서는 scripts/ai-end.sh --ready --pr|--web 이 같은 초안을 넣는다.
    # fork PR 은 github.token 에 write 권한이 없어 실패한다 — 이 저장소는 private 팀 저장소라 해당 없음.
    if: ${{ github.event.action == 'opened' && startsWith(github.head_ref, 'ws/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: fetch main
        run: git fetch origin main:refs/remotes/origin/main
      - name: fill title and body from the stream draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        # 플레이스홀더 마커 '<두세 문장' 은 .github/PULL_REQUEST_TEMPLATE.md 의 '무엇을 · 왜' 자리 문구다 — 템플릿을 바꾸면 같이 바꾼다.
        run: |
          args=()
          if [ -z "$PR_BODY" ] || printf '%s' "$PR_BODY" | grep -q '<두세 문장'; then
            bash scripts/ai-end.sh --pr-body > /tmp/pr-body.md
            args+=(--body-file /tmp/pr-body.md)
            echo "본문: 초안으로 채움"
          fi
          if ! printf '%s' "$PR_TITLE" | grep -qE '^[a-z-]+\([a-z0-9._/-]+\): .+ \[([0-9]{2}|-)/(T[0-9]+|-)\]$'; then
            args+=(--title "$(bash scripts/ai-end.sh --pr-title)")
            echo "제목: 규격으로 교체"
          fi
          if [ "${#args[@]}" -eq 0 ]; then echo "사람이 쓴 제목·본문 — 그대로 둔다"; exit 0; fi
          gh pr edit "$PR_NUMBER" "${args[@]}"

  ai-check:
    # 스트림 규칙 검사 — hotfix/* 브랜치는 Commands 만 검사한다.
    # pr-body 가 제목·본문을 고칠 수 있으니 그 뒤에 돌고(skip 돼도 돈다), 페이로드가 아니라 현재 값을 읽는다.
    # edited 에도 돈다 — 제목·본문을 규격대로 고치면 이 검사가 다시 돌아 초록이 되어야 한다.
    needs: [pr-body]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: fetch main
        run: git fetch origin main:refs/remotes/origin/main
      - name: ai-end.sh --ci
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title -q .title) \
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body) \
            bash scripts/ai-end.sh --ci

  commands:
    # AGENTS.md 의 Commands 를 한 job 에서 차례로 돌린다 — job 을 나누면 러너마다 checkout·pnpm install 이
    # 따로 돌아 벽시계는 줄지만 과금되는 러너-분은 3배가 된다. 싼 것부터(typecheck → lint → test) 돌려
    # 실패를 빨리 본다. 경고는 스크립트 자체가 실패로 만든다(tsc --noEmit · eslint --max-warnings=0 · prettier --check).
    # 이름은 그대로 둔다 — main 보호의 필수 검사 이름이다(ai-stream.sh setup: ai-check, commands).
    # 제목·본문만 고친 edited 이벤트에서는 돌리지 않는다.
    if: ${{ github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # spec·plan·phase-close 처럼 docs/·.ai/ 만 바꾼 PR 은 pnpm 을 아예 받지 않는다(전체 PR 의 40%).
      # 필수 검사라 job 을 건너뛰지(skip) 않고 성공으로 끝낸다 — skip 된 필수 검사는 병합을 영영 막는다.
      - name: does this touch code?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh pr diff "$PR_NUMBER" --name-only)
          if printf '%s\n' "$files" | grep -qE '^(src/|tests/|public/|index\.html|package\.json|pnpm-lock\.yaml|tsconfig|vite|vitest|eslint\.config\.js|\.prettierrc|\.nvmrc)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "코드 변경 없음 — typecheck·lint·test 를 건너뛴다"
          fi
      - uses: pnpm/action-setup@v6
        if: ${{ steps.scope.outputs.code == 'true' }}
      - uses: actions/setup-node@v7
        if: ${{ steps.scope.outputs.code == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        if: ${{ steps.scope.outputs.code == 'true' }}
        run: pnpm install --frozen-lockfile
      - name: typecheck
        if: ${{ steps.scope.outputs.code == 'true' }}
        run: pnpm typecheck
      - name: lint
        if: ${{ steps.scope.outputs.code == 'true' }}
        run: pnpm lint
      - name: test
        if: ${{ steps.scope.outputs.code == 'true' }}
        run: pnpm test
