name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ai-check:
    # 스트림 규칙 검사 — hotfix/* 브랜치는 Commands 만 검사한다
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: fetch main
        run: git fetch origin main:refs/remotes/origin/main
      - name: ai-end.sh --ci
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: bash scripts/ai-end.sh --ci

  commands:
    # AGENTS.md 의 Commands 4개를 그대로 돌린다. 경고는 스크립트 자체가 실패로 만든다
    # (eslint --max-warnings=0 · prettier --check · tsc --noEmit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
