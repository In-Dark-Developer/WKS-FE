# 운영 배포용 개인 fork 동기화 — main 병합마다 fork 의 main 을 이 저장소 main 으로 맞춘다.
# Netlify 는 fork 를 빌드하므로 이것이 곧 배포 트리거다. ADR-20260914-netlify-personal-fork · docs/deploy/netlify-fork.md
# fork 에도 이 파일이 복사되지만 저장소 조건으로 fork 안에서는 돌지 않는다. 변수·비밀값이 없으면 건너뛴다.
name: sync-fork

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'In-Dark-Developer/WKS-FE' && vars.NETLIFY_FORK_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: merge upstream into fork
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          FORK_REPO: ${{ vars.NETLIFY_FORK_REPO }}
        run: gh api -X POST "repos/$FORK_REPO/merge-upstream" -f branch=main
