# 운영 배포용 개인 fork 동기화 — main 병합마다 fork 의 main 을 이 저장소 main 과 같게 만든다.
# Netlify 는 fork 를 빌드하므로 이것이 곧 배포 트리거다. ADR-20260914-netlify-personal-fork · docs/deploy/netlify-fork.md
# 이 저장소는 Actions 기본 토큰으로 체크아웃하고, fork 에는 fork 한 곳에만 쓰기 권한이 있는 fine-grained 토큰으로 push 한다.
# (merge-upstream API 는 토큰이 조직 저장소까지 읽어야 해 fine-grained 토큰으로는 403 이 난다.)
# fork 에도 이 파일이 복사되지만 저장소 조건으로 fork 안에서는 돌지 않는다. 변수가 없으면 건너뛴다.
name: sync-fork

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'In-Dark-Developer/WKS-FE' && vars.NETLIFY_FORK_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      # fork 에 이력이 이어지게 push 하려면 얕은 클론이 아니라 전체 이력이 필요하다.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # fork 는 배포용 거울이라 upstream main 으로 덮어쓴다.
      - name: push main to fork
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          FORK_REPO: ${{ vars.NETLIFY_FORK_REPO }}
        run: |
          auth=$(printf 'x-access-token:%s' "$FORK_SYNC_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/$FORK_REPO.git" HEAD:refs/heads/main --force
