name: notion-index-sync

# docs/prd/*.md 의 FR·NFR 표를 ⚔️ PRD DB 에 복사한다. 단방향 — 보드를 고쳐도 저장소는 바뀌지 않는다.
# ADR·Phase 색인은 옛 워크스페이스에 있었고 지금 통합은 거기 접근 권한이 없다 — ⚔️ PRD 한 곳만 쓴다
# (ADR-20260923-prd-single-notion-db).
on:
  push:
    branches: [dev]
    paths: ['docs/prd/**']
  workflow_dispatch:

concurrency:
  group: notion-index-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: notion-index-sync.sh
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # ⚔️ PRD 의 database id 다 — 보드 URL 에 보이는 id(…80c9…)는 data source id 라
          # Notion-Version 2022-06-28 의 /v1/databases/{id} 가 404 를 낸다.
          NOTION_PRD_DB: 3dffb10f-6501-8042-8dd9-c7a0d162aceb
        run: bash scripts/notion-index-sync.sh --prd
