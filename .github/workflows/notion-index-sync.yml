name: notion-index-sync

# docs/prd/*.md 의 FR·NFR, docs/decisions/ADR-*.md, docs/phases/README.md 표를 Notion 색인 DB 에 복사한다. 단방향 — 색인을 고쳐도 저장소는 바뀌지 않는다.
on:
  push:
    branches: [dev]
    paths: ['docs/prd/**', 'docs/decisions/**', 'docs/phases/**']
  workflow_dispatch:

concurrency:
  group: notion-index-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe which databases the integration can reach
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          for id in 3dffb10f-6501-8042-8dd9-c7a0d162aceb 3dffb10f-6501-80c9-90c3-000b0186adcf 96bba6ec-55a7-4a1a-9474-298648f637a9 6585b534-8238-4856-bf1e-e121dc272c7f 10aa90e7-c6d1-4051-a227-8acec2d4fa44; do
            printf '%s ' "$id"
            curl -sS "https://api.notion.com/v1/databases/$id" \
              -H "Authorization: Bearer $NOTION_TOKEN" -H "Notion-Version: 2022-06-28" \
            | jq -r 'if .object=="error" then "NO  \(.status) \(.code)" else "OK  \(.title[0].plain_text // "")" end'
          done
      - name: notion-index-sync.sh
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PRD_DB: 3dffb10f-6501-80c9-90c3-000b0186adcf
          NOTION_ADR_DB: 96bba6ec-55a7-4a1a-9474-298648f637a9
          NOTION_PHASE_DB: 6585b534-8238-4856-bf1e-e121dc272c7f
          NOTION_TASK_DB: 10aa90e7-c6d1-4051-a227-8acec2d4fa44
        run: bash scripts/notion-index-sync.sh
