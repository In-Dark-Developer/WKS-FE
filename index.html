<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>운명도 꿰어야 사랑이다</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="생년월일로 점지받는 나의 인연" />
    <!-- 공유 링크 미리보기(08/T4, SC-6) — 크롤러는 JS 를 실행하지 않으므로 모든 경로가 같은 메타를 받는다(ADR-20260915-share-preview-static-meta). 이미지는 크롤러가 절대 주소로 가져가므로 해시 없는 public/og/ 에 둔다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="운명도 꿰어야 사랑이다" />
    <meta property="og:title" content="운명도 꿰어야 사랑이다" />
    <meta property="og:description" content="생년월일로 점지받는 나의 인연" />
    <meta property="og:url" content="https://threadoffate.site/" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://threadoffate.site/og/og-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="운명도 꿰어야 사랑이다" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="운명도 꿰어야 사랑이다" />
    <meta name="twitter:description" content="생년월일로 점지받는 나의 인연" />
    <meta name="twitter:image" content="https://threadoffate.site/og/og-v2.jpg" />
    <!-- 첫 방문 인트로 영상의 포스터(IntroVideo) — JS 보다 먼저 받아 두어 첫 화면 LCP 를 앞당긴다 (08/T5, NFR-2). -->
    <link rel="preload" as="image" href="/intro-poster.webp" fetchpriority="high" />
    <!-- Google tag (gtag.js) — 호출은 dataLayer 에 먼저 쌓고, 176KB 스크립트는 페이지 load 뒤에 받는다.
         첫 화면 JS·인트로 영상과 대역폭을 나누면 LCP 가 늦는다 (08/T5, NFR-2). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-K458Q00SJ3');

      window.addEventListener('load', function () {
        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-K458Q00SJ3';
        document.head.appendChild(tag);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
