# Netlify 배포 설정 — ADR-20260922-netlify-org-repo-direct, Phase 08 T2. Netlify 는 이 저장소(In-Dark-Developer/WKS-FE)의 main 을 빌드한다.
# 통합 브랜치는 dev 다 — 스트림은 dev 로 병합되고, 운영 배포는 dev → main 릴리스 PR 이 일으킨다 (ADR-20260923-dev-as-default-branch).
# dev 브랜치 배포(branch deploy)는 검색엔진에서 빠진다.
# Node 버전은 .nvmrc, pnpm 버전은 package.json packageManager 를 Netlify 가 읽는다.

[build]
  command = "pnpm build"
  publish = "dist"

# 비밀값이 아니다 — 프론트 번들에 그대로 들어가는 공개 주소.
[build.environment]
  VITE_API_BASE_URL = "https://api.threadoffate.site/api"

# SPA — 새로고침·공유 링크(/s/:shareId) 직접 진입도 index.html 이 받아 라우터가 그린다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite 가 파일 이름에 해시를 붙이는 산출물은 오래 캐시한다. index.html 은 Netlify 기본(매번 재검증).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# dev 브랜치 배포(dev.threadoffate.site)는 검색에 잡히지 않게 한다 — 운영과 같은 내용이 색인되면
# 검색 결과가 갈린다. netlify.toml 은 컨텍스트별 [[headers]] 를 지원하지 않아 빌드 뒤 _headers 를 만든다.
# TOML 리터럴 문자열(작은따옴표)이라 \n 이 그대로 printf 에 전달된다.
[context.dev]
  command = 'pnpm build && printf "/*\n  X-Robots-Tag: noindex\n" > dist/_headers'

# dev 브랜치 배포는 백엔드 dev 서버를 부른다 — 운영 데이터와 섞이지 않고, 로그인 쿠키(SameSite=Lax)가
# dev.threadoffate.site ↔ api-dev.threadoffate.site 같은 사이트 사이에서 오간다.
[context.dev.environment]
  VITE_API_BASE_URL = "https://api-dev.threadoffate.site/api"
